let lang='ko';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xf3f6fb);
const camera=new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.01, 100); camera.position.set(4,2,4);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(0.5,0.8,0); controls.update();
scene.add(new THREE.HemisphereLight(0xffffff,0x555555,1.4)); const dl=new THREE.DirectionalLight(0xffffff,1.2); dl.position.set(5,8,6); scene.add(dl);
const loader=new GLTFLoader();
loader.load('./models/PigDissect_S2c_FootPriority_FullScene.glb', (gltf)=>{
  gltf.scene.traverse(o=>{ if(o.isMesh){
    if(!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    o.userData.label = labels[o.name] || labels[o.parent?.name] || null;
    o.material = new THREE.MeshStandardMaterial({color:0xd0d7de, roughness:0.85, metalness:0.05});
  }});
  scene.add(gltf.scene);
});
const raycaster=new THREE.Raycaster(); const mouse=new THREE.Vector2();
renderer.domElement.addEventListener('click', (e)=>{
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1; raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(scene.children,true);
  const hit=hits.find(h=>h.object.userData.label);
  const el=document.getElementById('label');
  if(hit){ const d=hit.object.userData.label; el.textContent = lang==='ko' ? `NAV: ${d.nav}
KO: ${d.ko}
EN: ${d.en}` : `NAV: ${d.nav}
EN: ${d.en}
KO: ${d.ko}`; }
});
document.getElementById('koBtn').onclick=()=>lang='ko'; document.getElementById('enBtn').onclick=()=>lang='en';
